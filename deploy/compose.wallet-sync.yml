# Fragment for the body-ledger compose stack. Add it to COMPOSE_FILE in body-ledger's .env.
services:
  wallet-sync:
    build:
      context: ${WALLET_SYNC_DIR:?absolute path to the investment-wallet-sync checkout}
    restart: unless-stopped
    # `ai` is declared in body-ledger's compose.body-ledger.yml.
    networks: [default, ai]
    ports: ["127.0.0.1:${WALLET_SYNC_PORT:-8090}:8090"]
    volumes: ["wallet_sync_data:/data"]
    environment:
      WALLET_COUCH_URL: ${WALLET_COUCH_URL:?}
      WALLET_COUCH_DB: ${WALLET_COUCH_DB:?}
      WALLET_COUCH_LOGIN: ${WALLET_COUCH_LOGIN:?}
      WALLET_COUCH_TOKEN: ${WALLET_COUCH_TOKEN:?}
      WALLET_ALLOWED_USERS: ${WALLET_ALLOWED_USERS:?comma-separated Tailscale logins}
      # wallet-sync: the Host the opencode container sends to /mcp
      WALLET_ALLOWED_HOSTS: wallet-sync,${WALLET_ALLOWED_HOSTS:-}
      # /mcp needs Authorization: Bearer <WALLET_MCP_TOKEN>; empty = /mcp answers 404
      WALLET_MCP_TOKEN: ${WALLET_MCP_TOKEN:-}
      WALLET_VAPID_SUBJECT: ${WALLET_VAPID_SUBJECT:-}

  # body-ledger's opencode service: opencode.json reads the token as {env:WALLET_MCP_TOKEN}.
  opencode:
    environment:
      WALLET_MCP_TOKEN: ${WALLET_MCP_TOKEN:-}

volumes:
  wallet_sync_data:
